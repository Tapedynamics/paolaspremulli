      <h1>Riflessione</h1>

      </div>
      <div class="poem-text">
        <div class="stanza">
          E penso ai pensieri ancora vivi<br>
          di quelli che son già morti.<br>
          E penso a Dio.<br>
          E penso a Dio,<br>
          che pensa a loro.
        </div>
